# Thresholds: INFO (notify users), WARN (take action likely needed), CRIT (urgent)

#Log file location
LOG_FILE="logs/events.jsonl"

# =================== module 1: system health thresholds ===================  
CPU_INFO=50   CPU_WARN=70   CPU_CRIT=90     # CPU: High sustained usage can mask malicious cryptominers or brute-force scripts
MEM_INFO=60   MEM_WARN=75   MEM_CRIT=90     # MEMORY: High usage may indicate a Buffer Overflow attempt or memory-hungry exploit
SWAP_INFO=30  SWAP_WARN=50  SWAP_CRIT=80    # SWAP: Vital for catching "Resource Exhaustion" before the system hangs
DISK_INFO=60  DISK_WARN=75  DISK_CRIT=90    # DISK: Used to prevent "Log Flooding" attacks where attackers fill disks to crash services
LOAD_INFO=1   LOAD_WARN=2   LOAD_CRIT=4     # LOAD: Measures the task queue. Numbers are relative to CPU core count
ZOMBIE_INFO=2 ZOMBIE_WARN=5 ZOMBIE_CRIT=10  # ZOMBIES: Dead processes waiting for a 'parent' signal; can exhaust the PID table
IO_INFO=10    IO_WARN=20    IO_CRIT=50      # I/O WAIT: The % of time CPU is idle waiting for disk; key "Ransomware" signature


# =================== module 2: user activity thresholds ===================

# --- LOG PATHS ---
AUTH_LOG="/var/log/auth.log"
ALERT_LOG="hids_alerts.log"

# --- USER ACTIVITY THRESHOLDS ---
# Business hours for detecting out-of-hours logins
BUSINESS_HOURS_START=7      # Hours: logins before this are flagged (0-23)
BUSINESS_HOURS_END=20       # Hours: logins at or after this are flagged (0-23)

# INFO: Single events worth noting
SENSITIVE_USER="root"
EXPECTED_USER_COUNT=1
WARN_SUDO_COUNT=10
CRIT_SUDO_COUNT=15
ALLOWED_IP_RANGE="192.168.1."  # Matches your local subnet

# WARNING: Potential probing or policy violations
WARN_FAILED_LOGINS=5

# CRITICAL: High probability of an active breach
CRIT_FAILED_LOGINS=10



# =================== module 3 : process and network check ===================
# Paths that are suspicious because they are writable or ephemeral
# Attackers frequently drop payloads here
SUSPICIOUS_PATHS=(
  "/tmp/"
  "/var/tmp/"
  "/dev/shm/"
  "/run/user/"
  "/home/"
  "/root/"
)

# Trusted system binary locations
# Most legitimate OS binaries live here
TRUSTED_PATHS=(
  "/bin"
  "/sbin"
  "/usr/bin"
  "/usr/sbin"
  "/usr/lib"
  "/usr/libexec"
  "/lib"
  "/lib64"
  "/usr/lib/x86_64-linux-gnu"
)

# Suspicious command-line patterns
# These indicate inline execution or data transfer tools
SUSPICIOUS_CMD_PATTERNS=(
  "bash -c"
  "sh -c"
  "python -c"
  "curl "
  "wget "
  "nc "
  "base64"
  "/dev/tcp/"
)

# Suspicious ports (often used in C2 or reverse shells)
SUSPICIOUS_PORTS=("4444" "1337" "5555" "8081")

# Threshold for "too many" connections
ESTABLISHED_CONN_THRESHOLD=8


# =================== module 4: File Integrity thresholds ===================

# --- PATHS ---
FILE_BASELINE_DB="./data/file_baseline.db"
FILE_ALERT_LOG="./logs/alerts.log"

# --- SCANNING CONFIGURATION ---
FILE_SENSITIVE_DIRS="/etc /bin /sbin /usr/bin /usr/sbin /root"
FILE_RECENT_DAYS=1

# --- ALERT THRESHOLDS ---
FILE_ALERT_ON_NEW_SUID=true
FILE_ALERT_ON_WORLD_WRITABLE=true
FILE_ALERT_ON_PERMISSION_CHANGE=true
FILE_ALERT_ON_OWNER_CHANGE=true




















